sections:
  definition: >
    AST (Aspartate Aminotransferase) là enzyme có trong nhiều mô của cơ thể, đặc biệt là gan, cơ tim, cơ xương, thận và não. Khi các tế bào này bị tổn thương hoặc căng thẳng, AST được giải phóng vào máu làm tăng mức đo được. Không giống ALT (chủ yếu từ gan), AST không đặc hiệu cho gan — điều này làm phức tạp việc giải thích kết quả.

  normal_physiology: >
    AST tham gia vào quá trình chuyển hóa amino acid, đặc biệt trong chu trình urea và tổng hợp glucose từ amino acid (gluconeogenesis). Ở trạng thái bình thường, AST được giải phóng với lượng nhỏ vào máu từ quá trình tế bào bình thường. Mức AST trong máu phản ánh sự cân bằng giữa lượng giải phóng từ các mô và tốc độ đào thải. Ngưỡng bình thường thường là 10-40 U/L (tùy phòng xét nghiệm).

  causes_of_abnormality: >
    Nguyên nhân gan: viêm gan virus (A, B, C), gan nhiễm mỡ (NAFLD/NASH), tổn thương do rượu, thuốc gây độc gan (paracetamol liều cao, một số kháng sinh, statin hiếm gặp), viêm gan tự miễn, tắc mật. Nguyên nhân ngoài gan (quan trọng): vận động thể chất cường độ cao (gym, chạy marathon) làm tăng AST từ cơ xương đáng kể; nhồi máu cơ tim; tiêu cơ (rhabdomyolysis); bệnh cơ. Đây là lý do tỷ lệ AST/ALT quan trọng hơn AST đơn thuần.

  clinical_significance: >
    AST tăng nhẹ đến vừa (dưới 3-5 lần giới hạn trên) thường không đặc hiệu và cần bối cảnh lâm sàng để giải thích. Khi AST tăng kết hợp với ALT tăng (đặc biệt ALT cao hơn AST), nguồn gan được gợi ý nhiều hơn. Tỷ lệ AST/ALT >2 thường gợi ý tổn thương liên quan rượu. AST rất cao (>10 lần giới hạn trên) gợi ý tổn thương gan cấp nặng và cần đánh giá ngay.

  limitations: >
    AST không đặc hiệu cho gan — cơ bắp, tim và các mô khác cũng là nguồn. Người tập gym hoặc vận động nặng có thể có AST cao hoàn toàn bình thường do cơ. AST đơn lẻ không đủ để đánh giá chức năng gan — cần xem cùng ALT, GGT, bilirubin, albumin và thời gian prothrombin để có bức tranh đầy đủ. Một lần tăng đơn lẻ không thể kết luận — cần theo dõi.

  related_biomarkers:
    - alt
    - ggt
    - bilirubin
    - albumin
    - ck_creatine_kinase

  derived_indicators:
    - "AST/ALT ratio (De Ritis ratio)"

  patient_explanation: >
    AST là enzyme tồn tại trong gan, cơ tim và cơ xương. Khi bất kỳ tế bào nào trong số này bị kích thích hoặc tổn thương nhẹ, AST thoát ra vào máu. Vì vậy, AST tăng không tự động có nghĩa là gan bị bệnh — tập thể dục nặng ngày hôm trước cũng có thể làm tăng AST. Bác sĩ thường xem AST cùng với ALT (enzyme đặc hiệu gan hơn) để hiểu rõ hơn nguồn gốc và ý nghĩa.

