  lifestyle_relevance: >
    Hạn chế rượu bia — đây là nguyên nhân phổ biến nhất của tổn thương gan có thể phòng ngừa được. Tránh lạm dụng thuốc giảm đau không kê toa (paracetamol liều cao, NSAID). Giảm cân nếu thừa cân vì gan nhiễm mỡ (NAFLD) là nguyên nhân phổ biến nhất của men gan tăng nhẹ ở người không uống rượu. Chế độ ăn ít đường và chất béo bão hòa. Không sử dụng thực phẩm chức năng gan không có bằng chứng khoa học và chưa được bác sĩ tư vấn.

  doctor_discussion_topics:
    - "Tỷ lệ AST/ALT của tôi gợi ý nguồn gốc nào?"
    - "Tôi có cần siêu âm gan không?"
    - "Thuốc tôi đang dùng có thể ảnh hưởng đến men gan không?"
    - "Tôi nên xét nghiệm lại sau bao lâu?"

  guideline_notes: >
    Đánh giá men gan tăng cần xem xét bối cảnh lâm sàng đầy đủ: tiền sử rượu, thuốc, vận động, triệu chứng, và kết hợp với các xét nghiệm gan khác. AST tăng nhẹ đơn lẻ (dưới 2-3 lần giới hạn trên) thường được theo dõi lại trước khi làm thêm xét nghiệm chuyên sâu. Siêu âm gan thường được chỉ định khi men gan tăng dai dẳng không giải thích được.

