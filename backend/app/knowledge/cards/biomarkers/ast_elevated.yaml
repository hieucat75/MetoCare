short_summary_vi: "AST tăng có thể gợi ý căng thẳng tế bào gan hoặc cơ, nhưng cần xem xét cùng với ALT và bối cảnh lâm sàng — AST không đặc hiệu cho gan vì cơ bắp cũng là nguồn quan trọng."
