short_summary_vi: "ALT là enzyme đặc hiệu cho gan hơn AST — khi ALT tăng, nguồn gan được gợi ý nhiều; thường liên quan nhất đến gan nhiễm mỡ, đặc biệt khi kèm theo đề kháng insulin."
