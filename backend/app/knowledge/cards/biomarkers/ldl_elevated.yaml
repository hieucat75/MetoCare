sections:
  definition: >
    LDL (Low-Density Lipoprotein) là một loại lipoprotein trong máu có chức năng vận chuyển cholesterol từ gan đến các tế bào trong cơ thể. Khi LDL ở mức cao và kéo dài, phần dư thừa có thể bám vào thành mạch máu, dần dần tạo thành mảng xơ vữa. LDL thường được gọi là "cholesterol xấu" vì khi dư thừa nó gây hại cho mạch máu, không phải vì nó hoàn toàn vô dụng.

  normal_physiology: >
    Cơ thể cần một lượng LDL nhất định để vận chuyển cholesterol — một thành phần quan trọng để tạo màng tế bào, sản xuất hormone steroid và vitamin D. Gan điều tiết nồng độ LDL thông qua các thụ thể LDL (LDL receptors) — khi thụ thể hoạt động tốt, gan hấp thu LDL dư thừa và xử lý. Khi chế độ ăn hoặc yếu tố gene ảnh hưởng đến quá trình này, LDL trong máu có thể tăng cao.

  causes_of_abnormality: >
    Các nguyên nhân phổ biến khiến LDL tăng cao bao gồm: chế độ ăn nhiều chất béo bão hòa (thịt đỏ mỡ, bơ, phô mai béo) và chất béo chuyển hóa (đồ ăn nhanh, bánh ngọt công nghiệp), ít vận động, thừa cân hoặc béo phì, tiểu đường không được kiểm soát tốt, suy giáp, bệnh thận mạn, hoặc yếu tố di truyền (rối loạn lipid máu gia đình). Một số thuốc như corticosteroid, thuốc lợi tiểu thiazide cũng có thể làm tăng LDL.

  clinical_significance: >
    LDL cao kéo dài có thể gợi ý nguy cơ tích tụ mảng xơ vữa trong lòng mạch máu — một quá trình diễn ra từ từ trong nhiều năm. Bác sĩ thường xem xét LDL cùng với các yếu tố khác như tuổi, huyết áp, tiểu đường, hút thuốc lá và tiền sử gia đình để đánh giá nguy cơ tim mạch tổng thể. Không nên đánh giá LDL đơn lẻ mà không có bức tranh toàn cảnh về sức khỏe tim mạch.

  limitations: >
    LDL đơn thuần không phải yếu tố quyết định duy nhất về nguy cơ tim mạch. Một số người có LDL cao nhưng nguy cơ thực sự thấp (do có HDL tốt, không có các yếu tố nguy cơ khác). Ngược lại, LDL "bình thường" không loại trừ nguy cơ nếu các yếu tố khác bất lợi. Khi triglyceride >4.5 mmol/L, công thức Friedewald tính LDL có thể kém chính xác — nên đo LDL trực tiếp. Non-HDL và ApoB đôi khi phản ánh nguy cơ chính xác hơn LDL đơn thuần.

