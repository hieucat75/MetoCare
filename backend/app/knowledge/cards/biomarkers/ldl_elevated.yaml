  patient_explanation: >
    Hãy hình dung mạch máu như một đường ống nước. LDL giống như cặn bùn — ở mức vừa phải thì ổn, nhưng nếu quá nhiều, theo thời gian nó có thể bám vào thành ống và làm hẹp dần lòng mạch. Điều tốt là LDL có thể cải thiện được qua thay đổi lối sống và — nếu cần — điều trị y tế. Cơ thể bạn không bị hỏng; đây là tín hiệu sớm để hành động, không phải để lo lắng.

  common_questions:
    - "LDL của tôi cao bao nhiêu là nguy hiểm?"
    - "Ăn kiêng có giảm được LDL không?"
    - "Tôi có cần uống thuốc để hạ LDL không?"
    - "LDL cao có triệu chứng gì không?"
    - "LDL và cholesterol toàn phần khác nhau như thế nào?"

  lifestyle_relevance: >
    Chế độ ăn ảnh hưởng trực tiếp đến LDL: giảm chất béo bão hòa (thịt đỏ mỡ, bơ, phô mai béo), tăng chất xơ hòa tan (yến mạch, rau củ, đậu), bổ sung omega-3 (cá hồi, hạt lanh, hạt chia) có thể giúp giảm LDL. Vận động thể chất đều đặn (ít nhất 150 phút/tuần cường độ vừa như đi bộ nhanh) và duy trì cân nặng hợp lý cũng góp phần đáng kể. Không hút thuốc lá vì nicotine làm tổn thương thành mạch và làm giảm HDL.

  doctor_discussion_topics:
    - "Mục tiêu LDL phù hợp với nguy cơ tim mạch của tôi là bao nhiêu?"
    - "Tôi có cần đánh giá nguy cơ tim mạch 10 năm không?"
    - "Thay đổi lối sống trong bao lâu sẽ thấy hiệu quả trên xét nghiệm?"
    - "Khi nào tôi cần cân nhắc điều trị bằng thuốc?"

  guideline_notes: >
    Các hướng dẫn lâm sàng hiện tại đánh giá nguy cơ tim mạch dựa trên nhiều yếu tố tổng hợp, không chỉ dựa vào một chỉ số LDL đơn lẻ. Mục tiêu LDL khác nhau tùy theo mức độ nguy cơ tim mạch của từng cá nhân — người có tiền sử bệnh tim mạch hoặc nguy cơ cao có mục tiêu LDL nghiêm ngặt hơn so với người khỏe mạnh không có yếu tố nguy cơ. Can thiệp lối sống được khuyến nghị trước tiên đối với hầu hết trường hợp LDL tăng nhẹ đến trung bình.

