display_name_vi: "Creatinine (chức năng thận) tăng"
short_summary_vi: "Creatinine cao có thể gợi ý thận đang hoạt động kém hiệu quả hơn, nhưng cần xem trong bối cảnh toàn diện — khối cơ, mức độ mất nước, và xu hướng theo thời gian đều ảnh hưởng đến chỉ số này."
