display_name_vi: "Cholesterol HDL (tốt) thấp"
short_summary_vi: "HDL thấp có nghĩa là cơ thể có ít 'xe dọn dẹp' cholesterol hơn — điều này có thể liên quan đến tăng nguy cơ tim mạch, đặc biệt khi kết hợp với LDL cao hoặc triglyceride cao."
