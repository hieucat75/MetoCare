display_name_vi: "Huyết áp cao"
short_summary_vi: "Huyết áp cao kéo dài làm tăng gánh nặng cho tim và mạch máu — nhưng một lần đo cao không đủ để kết luận; cần đo nhiều lần trong nhiều ngày để đánh giá chính xác."
