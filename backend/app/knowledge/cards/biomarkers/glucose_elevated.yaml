display_name_vi: "Đường huyết lúc đói tăng"
short_summary_vi: "Đường huyết lúc đói cao hơn ngưỡng bình thường có thể gợi ý đề kháng insulin hoặc giai đoạn tiền tiểu đường — cần xem xét trong bối cảnh lối sống và xét nghiệm bổ sung."
