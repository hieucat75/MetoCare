[project]
name = "mcp-backend"
version = "0.1.0"
description = "Metabolic Care Platform — FastAPI modular monolith (Sprint 0 foundation)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as PostgreSQL integration tests (deselect with '-m not integration')",
    "real_consent: exercise the real Meto consent gate (skip the default grant-all fixture)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# Auto-generated Alembic migrations are not hand-linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "E402", "E501"]
"scripts/*" = ["E501"]
"app/services/clinical_explanation.py" = ["E501"]  # Long Vietnamese prompt strings
"app/domain/insight_detail_content.py" = ["E501"]  # Long Vietnamese content strings
"app/domain/patient_context.py" = ["E501"]         # Long Vietnamese content strings
"app/domain/clinical_patterns_v3.py" = ["E501"]    # Long Vietnamese content strings
"app/domain/priority_engine.py" = ["E501"]         # Long Vietnamese content strings
"app/api/v1/routes/patient_insight.py" = ["E501"]  # Long Vietnamese strings in route
"app/domain/health_timeline.py" = ["E501"]           # Long Vietnamese content strings
"app/ai/readiness.py" = ["E501"]                      # Long error detail strings in f-expressions
"app/services/narrative_prompts.py" = ["E501"]      # Long Vietnamese prompt strings
"app/services/medical_narrative.py" = ["E501"]      # Long Vietnamese fallback strings
"app/services/narrative_cache.py" = ["E501"]        # Long cache key construction
"app/api/v1/routes/narrative.py" = ["E501"]         # Long inline query strings
"app/api/v1/routes/health_timeline.py" = ["E501"]    # Long Vietnamese strings in route
"app/ai/context/builder.py" = ["E501"]              # Long context builder strings
"app/ai/exceptions.py" = ["E501"]                   # Long error message strings
"app/ai/prompt/assembler.py" = ["E501"]             # Long prompt strings
"app/ai/prompt/safety.py" = ["E501"]               # Long safety prompt strings
"app/services/meto_chat.py" = ["E501"]             # Long Meto service strings
"app/ai/registry.py" = ["E501", "B018"]            # Registry internals
