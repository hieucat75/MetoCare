# Journey A — Medical Document Intelligence (OCR review + confirm)
#
# App: MetoCare patient (Expo React Native) — appId me.metocare.patient
# Credentials come ONLY from env vars: ${MAESTRO_EMAIL} / ${MAESTRO_PASSWORD}
#   Run with:  maestro test -e MAESTRO_EMAIL=... -e MAESTRO_PASSWORD=... .maestro/01-documents.yaml
#
# NOTE (screen gaps found in mobile/app):
#   * The dashboard has NO "pending review" CTA. Its only document entry point is
#     "Thêm tài liệu" (testID dashboard-add-document) -> Add-Document screen, which
#     requires the OS camera/photo-library picker (testIDs add-take-photo /
#     add-choose-image). Maestro cannot drive the native picker headlessly, and
#     there is no UI path to a pre-seeded needs_review document.
#   * The review screen is a dynamic route /review/[documentId] reachable only
#     AFTER an upload returns a documentId. To exercise the seeded needs_review
#     doc (Amlodipine + LDL Cholesterol candidates) without a live camera, drive
#     it via deep link using its id — see the OPTIONAL block at the bottom.
#   The always-runnable part below covers login -> dashboard -> Add-Document.
appId: me.metocare.patient
---
# --- Stage 1: cold launch (independent run) ---
- launchApp:
    clearState: true

# --- Stage 2: log in with env credentials (email/password) ---
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 15000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"

# --- Stage 3: dashboard loads (network-dependent /auth/me) ---
- extendedWaitUntil:
    visible:
      id: "dashboard-empty"
    timeout: 15000
- assertVisible:
    text: "Xin chào.*"   # dashboard greeting from vi.ts

# --- Stage 4: open the Add-Document entry point ---
- scrollUntilVisible:
    element:
      id: "dashboard-add-document"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "dashboard-add-document"

# --- Stage 5: assert Add-Document screen + document-type selectors ---
- extendedWaitUntil:
    visible:
      text: "Thêm tài liệu y tế"   # documents.addTitle
    timeout: 15000
- assertVisible:
    id: "doctype-prescription"
- assertVisible:
    id: "doctype-lab_report"
- assertVisible:
    id: "doctype-general"
- assertVisible:
    id: "add-choose-image"
# Choose the prescription document type (state change, no picker involved)
- tapOn:
    id: "doctype-prescription"

