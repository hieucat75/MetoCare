# Journey A — Medical Document Intelligence (OCR review + confirm)
#
# App: MetoCare patient (Expo React Native) — appId me.metocare.patient
# Credentials come ONLY from env vars: ${MAESTRO_EMAIL} / ${MAESTRO_PASSWORD}
#   Run with:  maestro test -e MAESTRO_EMAIL=... -e MAESTRO_PASSWORD=... .maestro/01-documents.yaml
#
# Flow: login -> dashboard -> Add-Document -> ingest QA fixture (dev/staging only,
#       no camera) -> review screen -> confirm a candidate -> assert it flips to
#       the "Đã xác nhận" (confirmed/canonical) status badge.
#
# NOTE: the QA-fixture button (testID add-qa-fixture) only renders when the app is
#       built non-production (IS_NON_PRODUCTION). On a production build this control
#       is absent and there is no headless path to the review screen.
appId: me.metocare.patient
---
# --- Stage 1: cold launch (independent run) ---
- launchApp:
    clearState: true

# Dismiss first-run onboarding if present (clearState shows it)
- extendedWaitUntil:
    visible:
      id: "onboarding-skip"
    timeout: 60000
- tapOn:
    id: "onboarding-skip"

# --- Stage 2: log in with env credentials (email/password) ---
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 20000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"

# --- Stage 3: dashboard loads (network-dependent /auth/me) — gate on a CTA,
#     NOT dashboard-empty (the seeded pilot account has a populated dashboard) ---
- extendedWaitUntil:
    visible:
      id: "dashboard-add-document"
    timeout: 20000
- assertVisible:
    text: "Xin chào.*"   # dashboard.greeting

# --- Stage 4: open the Add-Document entry point ---
- scrollUntilVisible:
    element:
      id: "dashboard-add-document"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "dashboard-add-document"

# --- Stage 5: Add-Document screen + document-type selectors ---
- extendedWaitUntil:
    visible:
      text: "Thêm tài liệu y tế"   # documents.addTitle
    timeout: 15000
- assertVisible:
    id: "doctype-prescription"
- assertVisible:
    id: "doctype-lab_report"
- assertVisible:
    id: "doctype-general"

# --- Stage 6: ingest the seeded QA fixture (dev/staging only, no camera) ---
- extendedWaitUntil:
    visible:
      id: "add-qa-fixture"
    timeout: 15000
- tapOn:
    id: "add-qa-fixture"

# --- Stage 7: review screen loads (upload -> stage -> extract candidates) ---
- extendedWaitUntil:
    visible:
      text: "Kiểm tra & xác nhận"   # documents.reviewTitle
    timeout: 20000
# Candidate cards use dynamic testID candidate-<id>; wait for the first one.
- extendedWaitUntil:
    visible:
      id: "candidate-.*"
    timeout: 20000

# --- Stage 8: confirm the first open candidate (confirm buttons: confirm-<id>) ---
- tapOn:
    id: "confirm-.*"

# --- Stage 9: assert the candidate flipped to the confirmed/canonical badge ---
# After confirm the card renders status-<id> with text documents.confirmed.
- extendedWaitUntil:
    visible:
      id: "status-.*"
    timeout: 20000
- assertVisible:
    text: "Đã xác nhận"   # documents.confirmed
