# =============================================================================
# Azure Production Deploy — MANUAL ONLY (workflow_dispatch, confirm=PRODUCTION)
#
# Mirrors the ci.yml deploy-staging job with production values:
#   RG rg-metocare-prod / ENV cae-metocare-prod / KV discovered at runtime.
# Env-scoped secrets (GitHub environment azure-production):
#   RESOURCE_GROUP, POSTGRES_SERVER_NAME (+ repo-level AZURE_* OIDC ids).
# Provisioning prerequisite: scripts in the P0 exit review §4.
# =============================================================================
name: Azure Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PRODUCTION to confirm"
        required: true

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  RG: rg-metocare-prod
  ENV_NAME: cae-metocare-prod
  BACKEND_APP: ca-metocare-backend
  FRONTEND_APP: ca-metocare-frontend

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: azure-production

    steps:
      - uses: actions/checkout@v4

      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PRODUCTION" ]; then
            echo "::error::Type PRODUCTION in the confirm input to deploy."
            exit 1
          fi


      # ── Guard: production may only ever deploy from `main` ────────────────
      # workflow_dispatch accepts any ref, so without this a production deploy
      # could be run from an unreviewed feature branch.
      - name: Guard - production deploys only from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production deploys only from main (got ${{ github.ref }})."
            exit 1
          fi

      # ── Resolve image tag (SHA8 + epoch for uniqueness) ──────────────────
      - name: Resolve image tag
        id: tag
        run: |
          SHA8=$(git rev-parse --short=8 HEAD)
          EPOCH=$(date +%s)
          echo "tag=${SHA8}-${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "sha8=${SHA8}" >> "$GITHUB_OUTPUT"

      # ── Azure OIDC login ──────────────────────────────────────────────────
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production Key Vault
        run: |
          KV=$(az keyvault list -g "$RG" --query "[0].name" -o tsv)
          if [ -z "$KV" ]; then
            echo "::error::No Key Vault found in $RG — run provisioning first."
            exit 1
          fi
          echo "KV_NAME=$KV" >> "$GITHUB_ENV"
          echo "Key Vault: $KV"

      - name: Ensure containerapp CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # ── Resolve ACA environment domain (needed to bake backend FQDN into frontend) ──
      - name: Compute Container Apps FQDNs
        run: |
          DOMAIN=$(az containerapp env show -g "$RG" -n "$ENV_NAME" \
            --query 'properties.defaultDomain' -o tsv)
          if [ -z "$DOMAIN" ]; then
            echo "::error::Could not resolve ACA env defaultDomain for $ENV_NAME — aborting"
            exit 1
          fi
          echo "BACKEND_FQDN=${BACKEND_APP}.${DOMAIN}" >> "$GITHUB_ENV"
          echo "FRONTEND_FQDN=${FRONTEND_APP}.${DOMAIN}" >> "$GITHUB_ENV"
          echo "Backend:  https://${BACKEND_APP}.${DOMAIN}"
          echo "Frontend: https://${FRONTEND_APP}.${DOMAIN}"

      # ── GHCR login ────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & push backend image ────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}

      # ── Build & push frontend image (NEXT_PUBLIC_API_URL baked at build) ──
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ env.BACKEND_FQDN }}/api/v1
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_BUILD_SHA=${{ steps.tag.outputs.sha8 }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/metocare-frontend:${{ steps.tag.outputs.tag }}

      # ── Resume Postgres if stopped ────────────────────────────────────────
      - name: Resume Postgres if stopped
        run: |
          PG_NAME="${{ secrets.POSTGRES_SERVER_NAME }}"
          STATE=$(az postgres flexible-server show -g "$RG" -n "$PG_NAME" --query state -o tsv 2>/dev/null || echo "Unknown")
          echo "Postgres state: $STATE"
          if [ "$STATE" = "Stopped" ]; then
            az postgres flexible-server start -g "$RG" -n "$PG_NAME"
            until [ "$(az postgres flexible-server show -g "$RG" -n "$PG_NAME" --query state -o tsv)" = "Ready" ]; do
              echo "  waiting for Postgres..."; sleep 10
            done
          fi

      # ── Read secrets from Key Vault ───────────────────────────────────────
      - name: Read secrets from Key Vault
        run: |
          DB_URL=$(az keyvault secret show --vault-name "$KV_NAME" -n mcp-database-url --query value -o tsv)
          SECRET_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n mcp-secret-key --query value -o tsv)
          ENC_KEYS=$(az keyvault secret show --vault-name "$KV_NAME" -n mcp-encryption-keys --query value -o tsv)
          APPI=$(az keyvault secret show --vault-name "$KV_NAME" -n appinsights-connection-string --query value -o tsv)
          DOC_INTEL_ENDPOINT=$(az keyvault secret show --vault-name "$KV_NAME" -n azure-doc-intel-endpoint --query value -o tsv)
          DOC_INTEL_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n azure-doc-intel-key --query value -o tsv)
          DEEPSEEK_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n deepseek-api-key --query value -o tsv)
          # OpenRouter — Meto AI primary gateway (Claude Sonnet 4.5). DeepSeek stays as fallback.
          OPENROUTER_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n openrouter-api-key --query value -o tsv)
          echo "::add-mask::$DB_URL"; echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$ENC_KEYS"; echo "::add-mask::$DOC_INTEL_KEY"; echo "::add-mask::$DEEPSEEK_KEY"; echo "::add-mask::$OPENROUTER_KEY"
          {
            echo "DB_URL<<EOF"; echo "$DB_URL"; echo "EOF"
            echo "SECRET_KEY<<EOF"; echo "$SECRET_KEY"; echo "EOF"
            echo "ENC_KEYS<<EOF"; echo "$ENC_KEYS"; echo "EOF"
            echo "APPI<<EOF"; echo "$APPI"; echo "EOF"
            echo "DOC_INTEL_ENDPOINT<<EOF"; echo "$DOC_INTEL_ENDPOINT"; echo "EOF"
            echo "DOC_INTEL_KEY<<EOF"; echo "$DOC_INTEL_KEY"; echo "EOF"
            echo "DEEPSEEK_KEY<<EOF"; echo "$DEEPSEEK_KEY"; echo "EOF"
            echo "OPENROUTER_KEY<<EOF"; echo "$OPENROUTER_KEY"; echo "EOF"
          } >> "$GITHUB_ENV"

      # ── Pre-migration soft-delete audit (automated gate, replaces manual step) ─
      # DATABASE_URL must be the Key Vault mcp-database-url (same source as the
      # migration job) — the GitHub DATABASE_URL secret is not a full psql URL.
      # MEDICATION_SOFT_DELETE_MAPPINGS: per-record review approvals
      # ("<id>:<status>,..."), a SECRET so ids never reach the public log.
      # Remove the secret once the P0 migration has run.
      # ── Record the rollback target BEFORE anything changes ────────────────
      #
      # The only rollback statement in this workflow was a comment claiming ACA
      # "keeps previous healthy revision (auto-rollback)" — which PROD-F13
      # already records as unfounded without a configured readiness probe. Even
      # where it holds, it does not tell an on-call at 3am WHICH revision to go
      # back to; they would be reading `az containerapp revision list` on a
      # system that has already changed underneath them.
      #
      # Captured before the migration, so the name in this log is the revision
      # that was serving traffic when the deploy began. Never fatal: a first
      # deploy legitimately has no predecessor, and refusing to deploy over that
      # would be a gate on nothing.
      - name: Record rollback target
        run: |
          PREV=$(az containerapp revision list -g "$RG" -n "$BACKEND_APP" \
            --query "[?properties.active]|[0].name" -o tsv 2>/dev/null || echo "")
          PREV_IMG=$(az containerapp revision list -g "$RG" -n "$BACKEND_APP" \
            --query "[?properties.active]|[0].properties.template.containers[0].image" \
            -o tsv 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            echo "::warning::No active revision on $BACKEND_APP — treating this as a"
            echo "::warning::first deploy. There is no rollback target."
            exit 0
          fi
          echo "ROLLBACK TARGET revision : $PREV"
          echo "ROLLBACK TARGET image    : $PREV_IMG"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Rollback target (captured before migration)"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Revision | \`$PREV\` |"
              echo "| Image | \`$PREV_IMG\` |"
              echo ""
              echo "To roll the backend back to it:"
              echo ""
              echo '```bash'
              echo "az containerapp ingress traffic set -g $RG -n $BACKEND_APP \\"
              echo "  --revision-weight $PREV=100"
              echo '```'
              echo ""
              echo "> A **data** rollback is a separate decision. Do NOT run an"
              echo "> Alembic downgrade to undo a PHI-encryption migration: the"
              echo "> SEC-F11/j4_m10 migrations refuse to decrypt with a wrong key"
              echo "> and abort rather than destroy data. Restore via PITR instead."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pre-migration soft-delete audit
        run: bash scripts/pre_migration_audit.sh
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          POSTGRES_SERVER_NAME: ${{ secrets.POSTGRES_SERVER_NAME }}
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          MEDICATION_SOFT_DELETE_MAPPINGS: ${{ secrets.MEDICATION_SOFT_DELETE_MAPPINGS }}

      # ── Pre-migration DB backup (RISK-4 fix) ─────────────────────────────
      # ENV arg is literal "production" — env.ENVIRONMENT is only defined in
      # the test jobs, so referencing it here expands to empty and the
      # script's usage check fails.
      - name: Pre-migration DB backup
        run: bash scripts/pre_migration_backup.sh production $(date +%Y%m%dT%H%M%S) ${{ github.sha }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          POSTGRES_SERVER_NAME: ${{ secrets.POSTGRES_SERVER_NAME }}
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}

      # ── Run Alembic migration (one-shot Container Apps Job) ───────────────
      - name: Run Alembic migration
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}"
          JOB="caj-metocare-migrate"
          az containerapp job delete -g "$RG" -n "$JOB" --yes -o none 2>/dev/null || true
          az containerapp job create \
            --name "$JOB" --resource-group "$RG" --environment "$ENV_NAME" \
            --image "$IMG" \
            --trigger-type Manual \
            --replica-timeout 600 --replica-retry-limit 1 \
            --parallelism 1 --replica-completion-count 1 \
            --cpu 0.5 --memory 1.0Gi \
            --secrets "db-url=$DB_URL" "enc-keys=$ENC_KEYS" \
            --env-vars "MCP_DATABASE_URL=secretref:db-url" "MCP_ENV=production" \
              "MCP_ENCRYPTION_KEYS=secretref:enc-keys" \
            --command "alembic" --args "upgrade" "head" \
            -o none
          az containerapp job start -g "$RG" -n "$JOB" -o none
          for i in $(seq 1 40); do
            ST=$(az containerapp job execution list -g "$RG" -n "$JOB" \
              --query "[0].properties.status" -o tsv 2>/dev/null || echo Running)
            echo "  $i: $ST"
            [ "$ST" = "Succeeded" ] && break
            [ "$ST" = "Failed" ] && { echo "::error::Alembic migration failed"; exit 1; }
            sleep 10
          done

      # ── Remove the Alembic migration job (it holds the PHI master key) ────
      #
      # `if: always()` — the reason to delete it is not tidiness. Since the
      # migration job started receiving `enc-keys=$ENC_KEYS` (without which it
      # would encrypt production PHI with the repository default, as it did to
      # staging on 2026-08-06), it retains the production database URL AND
      # MCP_ENCRYPTION_KEYS as job secrets between deploys, in a resource nobody
      # watches, readable by any principal with Microsoft.App/jobs/listSecrets
      # on the resource group. Deleting it only at the START of the next deploy
      # parks the master PHI key there for however long that is. The
      # crypto-smoke job already had this cleanup for exactly this reason;
      # handing the migration job the same secret without the same cleanup
      # widens the key's blast radius as a side effect of fixing the key bug.
      #
      # Failure here does not fail the deploy — the migration has already given
      # its verdict — but it is loud so the residue gets removed by hand.
      - name: Remove Alembic migration job
        if: always()
        run: |
          JOB="caj-metocare-migrate"
          if az containerapp job show -g "$RG" -n "$JOB" -o none 2>/dev/null; then
            if ! az containerapp job delete -g "$RG" -n "$JOB" --yes -o none; then
              echo "::warning::Could not delete $JOB. It holds the production"
              echo "::warning::database URL and MCP_ENCRYPTION_KEYS as job secrets."
              echo "::warning::Delete it manually:"
              echo "::warning::  az containerapp job delete -g $RG -n $JOB --yes"
            fi
          fi

      # ── Read-only PHI population preflight ───────────────────────────────
      #
      # Decides ONE thing: may the crypto smoke accept an empty database as a
      # verdict rather than a failure. It is derived here, from a live count
      # taken immediately before the smoke, rather than hard-coded as a
      # production environment variable — a permanent variable would still be
      # set on the deploy after this one, when production DOES hold rows, and
      # would then permit an unverified pass on a populated database.
      #
      # Receives db-url ONLY. It counts rows, so it needs no MCP_ENCRYPTION_KEYS,
      # and after 2026-08-06 a job that never holds the PHI key is worth having.
      #
      # Fails closed by construction: `allow_empty` is set to 1 only when the job
      # reports Succeeded, which `run_phi_population.py` returns only when every
      # counted table answered and every one of them was empty. "Rows exist", "a
      # count failed" and "the job never ran" all leave it 0.
      - name: Read-only PHI population preflight
        id: population
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}"
          JOB="caj-metocare-phi-population"
          echo "allow_empty=0" >> "$GITHUB_OUTPUT"
          if ! az containerapp job delete -g "$RG" -n "$JOB" --yes -o none 2>/dev/null; then
            echo "  (no pre-existing $JOB to remove)"
          fi
          az containerapp job create \
            --name "$JOB" --resource-group "$RG" --environment "$ENV_NAME" \
            --image "$IMG" \
            --trigger-type Manual \
            --replica-timeout 300 --replica-retry-limit 0 \
            --parallelism 1 --replica-completion-count 1 \
            --cpu 0.5 --memory 1.0Gi \
            --secrets "db-url=$DB_URL" \
            --env-vars "MCP_DATABASE_URL=secretref:db-url" "MCP_ENV=production" \
            --command "python" --args "run_phi_population.py" \
            -o none
          az containerapp job start -g "$RG" -n "$JOB" -o none
          EXEC=$(az containerapp job execution list -g "$RG" -n "$JOB" \
            --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ -z "$EXEC" ]; then
            echo "::warning::population preflight reported no execution; the"
            echo "::warning::empty-database verdict stays DENIED."
            exit 0
          fi
          ST=""
          for i in $(seq 1 30); do
            ST=$(az containerapp job execution show -g "$RG" -n "$JOB" \
              --job-execution-name "$EXEC" \
              --query "properties.status" -o tsv 2>/dev/null || echo Running)
            echo "  population $i: $ST"
            [ "$ST" = "Succeeded" ] && break
            [ "$ST" = "Failed" ] && break
            sleep 10
          done
          if [ "$ST" = "Succeeded" ]; then
            echo "  database is provably EMPTY — empty-database verdict permitted"
            echo "allow_empty=1" >> "$GITHUB_OUTPUT"
          else
            echo "  population not proven empty (status: ${ST:-unknown}) —"
            echo "  the smoke must verify real rows, as normal."
          fi

      - name: Remove PHI population job
        if: always()
        run: |
          JOB="caj-metocare-phi-population"
          if az containerapp job show -g "$RG" -n "$JOB" -o none 2>/dev/null; then
            if ! az containerapp job delete -g "$RG" -n "$JOB" --yes -o none; then
              echo "::warning::Could not delete $JOB. It holds the production"
              echo "::warning::database URL as a job secret (no encryption key)."
              echo "::warning::Delete it manually:"
              echo "::warning::  az containerapp job delete -g $RG -n $JOB --yes"
            fi
          fi

      # ── Post-migration PHI crypto smoke (BLOCKS the rollout) ──────────────
      #
      # Runs AFTER `alembic upgrade head` and BEFORE any traffic-carrying
      # revision exists. That ordering is the point: the migration has already
      # touched encrypted columns, and the next step would put a new revision in
      # front of patients. If the deployed MCP_ENCRYPTION_KEYS cannot read what
      # is at rest, this fails here — no revision is created, and the
      # currently-serving production revision keeps running untouched.
      #
      # Why production needs it more than staging: boot validation proves each
      # key is well-FORMED, not that it is the RIGHT key. On a real database
      # with a wrong-but-valid key, boot PASSES, /health PASSES (it is
      # `SELECT 1`), the unauthenticated smoke suite PASSES (it asserts 401s),
      # and every authenticated encrypted read raises. Notification.title/body
      # and MedicationStatement.raw_drug_name are NOT NULL with
      # on_decrypt_failure="raise", so medication reminders and the medication
      # timeline are down for every patient while the deploy is reported green.
      # A mis-rotation is the realistic way to get there and it is completely
      # silent — which is why the gate belongs in the environment where it
      # matters, not only in the one where it is cheap.
      #
      # It writes only synthetic `CRYPTO-SMOKE-<uuid4>` sentinels, inside a
      # transaction rolled back in a `finally`, and prints no PHI, no key and no
      # key fragment — only an entity name and a reason code.
      # `--allow-production` is REQUIRED: the script refuses a production
      # database without it, via an allow-list, so an unset or misspelled
      # MCP_ENV fails closed rather than writing sentinels wherever it points.
      - name: Post-migration PHI crypto smoke
        run: |
          # Every value is rebuilt HERE. A `run:` step is a fresh shell, so a
          # variable assigned in an earlier step does not survive; an earlier
          # draft of the staging step referenced $MIGRATE_JOB/$ACA_ENV/$IMG, all
          # empty here, so it would have failed on EVERY deploy without ever
          # invoking the smoke — and that failure is indistinguishable in the log
          # from a real wrong-key failure, which is how a gate gets muted as
          # "the usual broken step".
          JOB="caj-metocare-crypto-smoke"
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}"
          # Delete-then-create. A REUSED job runs the PREVIOUS execution's image
          # and secrets, so it would validate the OLD key — precisely the
          # rotation failure this exists to catch — and report pass.
          #
          # The delete is NOT allowed to fail silently. `|| true` on a step whose
          # own comment calls delete-before-create load-bearing means a failed
          # delete leaves the old job (and its old executions) in place, and the
          # create below upserts onto it. "Absent" is success; anything else is
          # a hard stop.
          if az containerapp job show -g "$RG" -n "$JOB" -o none 2>/dev/null; then
            if ! az containerapp job delete -g "$RG" -n "$JOB" --yes -o none; then
              echo "::error::Could not delete the previous crypto-smoke job."
              echo "::error::Refusing to reuse it: a reused job runs the PREVIOUS"
              echo "::error::image and secrets, so it would verify the OLD key and"
              echo "::error::report pass. Remove it manually and re-run:"
              echo "::error::  az containerapp job delete -g $RG -n $JOB --yes"
              exit 1
            fi
          fi
          az containerapp job create -g "$RG" -n "$JOB" \
            --environment "$ENV_NAME" --trigger-type Manual --replica-timeout 600 \
            --replica-retry-limit 0 --parallelism 1 --replica-completion-count 1 \
            --image "$IMG" --cpu 0.5 --memory 1Gi \
            --secrets db-url="$DB_URL" enc-keys="$ENC_KEYS" \
            --env-vars MCP_DATABASE_URL=secretref:db-url \
              MCP_ENCRYPTION_KEYS=secretref:enc-keys MCP_ENV=production \
              MCP_CRYPTO_SMOKE_ALLOW_PRODUCTION=1 \
              MCP_CRYPTO_SMOKE_ALLOW_EMPTY=${{ steps.population.outputs.allow_empty }} \
              MCP_BUILD_SHA=${{ steps.tag.outputs.sha8 }} \
            --command "python" --args "run_crypto_smoke.py" -o none
          az containerapp job start -g "$RG" -n "$JOB" -o none

          # 40x10s = 400s of polling against a 600s --replica-timeout: Azure
          # needs slack after the container's own limit fires to mark the
          # execution Failed. A loop that expires WITHOUT a verdict must FAIL.
          # Falling out of it and exiting 0 would report a deploy healthy on the
          # strength of a check that never returned — the same false green this
          # step exists to remove.
          # Poll THIS execution by name. `[0]` has no ordering guarantee, so a
          # stale `Succeeded` from an earlier deploy could be read as this run's
          # verdict — the loop would break immediately and the deploy proceed
          # having verified nothing. The job is newly created above, so it has
          # exactly one execution; resolving its name makes that explicit rather
          # than assumed.
          EXEC=$(az containerapp job execution list -g "$RG" -n "$JOB" \
            --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ -z "$EXEC" ]; then
            echo "::error::The crypto-smoke job reported no execution to poll."
            echo "::error::Treating as FAILED — a deploy must not proceed on a"
            echo "::error::check that never started."
            exit 1
          fi
          echo "  crypto-smoke execution: $EXEC"
          ST=""
          for i in $(seq 1 40); do
            ST=$(az containerapp job execution show -g "$RG" -n "$JOB" \
              --job-execution-name "$EXEC" \
              --query "properties.status" -o tsv 2>/dev/null || echo Running)
            echo "  crypto-smoke $i: $ST"
            [ "$ST" = "Succeeded" ] && break
            if [ "$ST" = "Failed" ]; then
              echo "::error::PRODUCTION PHI crypto smoke FAILED — encrypted"
              echo "::error::columns are not readable with the MCP_ENCRYPTION_KEYS"
              echo "::error::this deploy would ship. NO revision has been created,"
              echo "::error::so the currently-serving revision is unaffected."
              echo "::error::Remediation: restore the previous key in Key Vault"
              echo "::error::(secret mcp-encryption-keys) and re-run this workflow."
              echo "::error::Do NOT run an Alembic downgrade — the SEC-F11/P1-5"
              echo "::error::migrations refuse to decrypt with a wrong key and"
              echo "::error::abort rather than destroy data."
              echo "::error::Inspect: az containerapp job execution list -g $RG -n $JOB"
              exit 1
            fi
            sleep 10
          done
          if [ "$ST" != "Succeeded" ]; then
            echo "::error::PRODUCTION PHI crypto smoke did not report a verdict"
            echo "::error::within 400s (last status: ${ST:-unknown}). Treating as"
            echo "::error::FAILED: a deploy must not be called healthy on a check"
            echo "::error::that never returned. No revision has been created."
            echo "::error::Remediation: inspect the job, then re-run this workflow"
            echo "::error::once it reports a verdict."
            echo "::error::Inspect: az containerapp job execution list -g $RG -n $JOB"
            exit 1
          fi

      # ── Remove the smoke job (it holds the production PHI key) ────────────
      #
      # `if: always()` — this must run whether the smoke passed, failed, or the
      # step timed out, because the reason to remove it is not tidiness. The job
      # was created with `--secrets enc-keys=...`, so between deploys it retains
      # the production database URL and MCP_ENCRYPTION_KEYS in a resource nobody
      # watches. Deleting it only at the START of the next deploy meant the
      # master PHI key sat in a second, unmonitored location indefinitely —
      # readable by any principal with Microsoft.App/jobs/listSecrets on the
      # resource group. That is a new expansion of the key's blast radius, added
      # by the gate itself.
      #
      # Failure here does not fail the deploy: the gate has already given its
      # verdict, and blocking a healthy rollout on a cleanup error would be the
      # wrong trade. It is loud so the residue gets removed by hand.
      - name: Remove crypto-smoke job
        if: always()
        run: |
          JOB="caj-metocare-crypto-smoke"
          if az containerapp job show -g "$RG" -n "$JOB" -o none 2>/dev/null; then
            if ! az containerapp job delete -g "$RG" -n "$JOB" --yes -o none; then
              echo "::warning::Could not delete $JOB. It holds the production"
              echo "::warning::database URL and MCP_ENCRYPTION_KEYS as job secrets."
              echo "::warning::Delete it manually:"
              echo "::warning::  az containerapp job delete -g $RG -n $JOB --yes"
            fi
          fi

      # ── Deploy backend Container App ──────────────────────────────────────
      - name: Deploy backend to ACA
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}"
          COMMON_SECRETS="db-url=$DB_URL secret-key=$SECRET_KEY enc-keys=$ENC_KEYS appi=$APPI doc-intel-key=$DOC_INTEL_KEY deepseek-api-key=$DEEPSEEK_KEY openrouter-api-key=$OPENROUTER_KEY"
          COMMON_ENV="MCP_ENV=production MCP_DEBUG=false \
            MCP_DATABASE_URL=secretref:db-url MCP_SECRET_KEY=secretref:secret-key \
            MCP_ENCRYPTION_KEYS=secretref:enc-keys \
            APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appi \
            MCP_BUILD_SHA=${{ steps.tag.outputs.sha8 }} \
            MCP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            MCP_EXPECTED_HOST=app.metocare.me \
            MCP_CORS_ALLOWED_ORIGINS=https://${FRONTEND_FQDN},https://app.metocare.me \
            MCP_AI_MODE=production MCP_LLM_PROVIDER=deepseek MCP_OCR_MODE=mock \
            MCP_OCR_WORKER_ENABLED=false MCP_RAG_ENABLED=false \
            MCP_STORAGE_MODE=local MCP_RATELIMIT_BACKEND=memory \
            MCP_METRICS_ENABLED=true MCP_ENABLE_DOCS=false \
            MCP_FEATURE_OCR=true MCP_FEATURE_OCR_CLOUD_FALLBACK=true \
            MCP_OCR_CLOUD_PROVIDER=azure \
            AZURE_DOC_INTEL_ENDPOINT=${DOC_INTEL_ENDPOINT} \
            AZURE_DOC_INTEL_KEY=secretref:doc-intel-key \
            MCP_DEEPSEEK_API_KEY=secretref:deepseek-api-key \
            MCP_OPENROUTER_API_KEY=secretref:openrouter-api-key \
            MCP_OPENROUTER_PRIMARY_MODEL=anthropic/claude-sonnet-4.5 \
            MCP_OPENROUTER_FALLBACK_MODEL=openai/gpt-4o-mini"
          SUFFIX="be-${{ steps.tag.outputs.sha8 }}-$(date +%s)"
          if az containerapp show -g "$RG" -n "$BACKEND_APP" -o none 2>/dev/null; then
            az containerapp secret set -g "$RG" -n "$BACKEND_APP" --secrets $COMMON_SECRETS -o none
            az containerapp update -g "$RG" -n "$BACKEND_APP" --image "$IMG" \
              --revision-suffix "$SUFFIX" \
              --min-replicas 1 --set-env-vars $COMMON_ENV -o none
          else
            az containerapp create -g "$RG" -n "$BACKEND_APP" --environment "$ENV_NAME" \
              --image "$IMG" --target-port 8000 --ingress external \
              --min-replicas 1 --max-replicas 1 --cpu 0.5 --memory 1.0Gi \
              --revision-suffix "$SUFFIX" \
              --secrets $COMMON_SECRETS --env-vars $COMMON_ENV -o none
          fi

      # ── Deploy frontend Container App ─────────────────────────────────────
      - name: Deploy frontend to ACA
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-frontend:${{ steps.tag.outputs.tag }}"
          API_URL="https://${BACKEND_FQDN}/api/v1"
          SUFFIX="fe-${{ steps.tag.outputs.sha8 }}-$(date +%s)"
          if az containerapp show -g "$RG" -n "$FRONTEND_APP" -o none 2>/dev/null; then
            az containerapp update -g "$RG" -n "$FRONTEND_APP" --image "$IMG" \
              --revision-suffix "$SUFFIX" \
              --min-replicas 1 --set-env-vars "NEXT_PUBLIC_API_URL=$API_URL" -o none
          else
            az containerapp create -g "$RG" -n "$FRONTEND_APP" --environment "$ENV_NAME" \
              --image "$IMG" --target-port 3000 --ingress external \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --revision-suffix "$SUFFIX" \
              --env-vars "NEXT_PUBLIC_API_URL=$API_URL" -o none
          fi

      # ── CORS guard — ensure app.metocare.me survives every deploy ─────────
      - name: CORS guard
        run: |
          CURRENT=$(az containerapp show -g "$RG" -n "$BACKEND_APP" \
            --query "properties.template.containers[0].env[?name=='MCP_CORS_ALLOWED_ORIGINS'].value" \
            -o tsv)
          if echo "$CURRENT" | grep -q "app.metocare.me"; then
            echo "✅ CORS OK: $CURRENT"
          else
            echo "⚠️ Patching CORS: $CURRENT"
            az containerapp update -g "$RG" -n "$BACKEND_APP" \
              --set-env-vars "MCP_CORS_ALLOWED_ORIGINS=${CURRENT},https://app.metocare.me" \
              -o none
            echo "✅ CORS patched"
          fi

      # ── Health gate — wait for backend ready ──────────────────────────────
      - name: Wait for backend healthy
        run: |
          echo "Polling https://${BACKEND_FQDN}/api/v1/health ..."
          for i in $(seq 1 18); do
            H=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${BACKEND_FQDN}/api/v1/health" || echo 000)
            echo "  $i: /api/v1/health -> $H"
            [ "$H" = "200" ] && { echo "✅ Backend healthy"; break; }
            [ "$i" = "18" ] && { echo "::error::Backend unhealthy after 3 min — ACA keeps previous healthy revision (auto-rollback)"; exit 1; }
            sleep 10
          done

      # ── Health gate — wait for frontend ready ─────────────────────────────
      - name: Wait for frontend healthy
        run: |
          echo "Polling https://${FRONTEND_FQDN}/ ..."
          for i in $(seq 1 18); do
            H=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${FRONTEND_FQDN}/" || echo 000)
            echo "  $i: / -> $H"
            [ "$H" = "200" ] && { echo "✅ Frontend healthy"; break; }
            [ "$i" = "18" ] && { echo "::error::Frontend unhealthy after 3 min"; exit 1; }
            sleep 10
          done

      # ── Smoke tests ───────────────────────────────────────────────────────
      # Routes sourced from scripts/smoke-routes.sh (auto-generated from OpenAPI).
      # To regenerate: cd backend && python3 ../scripts/generate-smoke-routes.py > ../scripts/smoke-routes.sh
      - name: Smoke tests
        run: |
          BASE_BE="https://${BACKEND_FQDN}"
          BASE_FE="https://${FRONTEND_FQDN}"
          PASS=true

          check() {
            local desc="$1" url="$2" expected="${3:-200}" method="${4:-GET}"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" "$url" --max-time 30)
            if [ "$code" = "$expected" ]; then
              echo "✅ $desc: $code"
            else
              echo "❌ $desc: expected $expected got $code"
              PASS=false
            fi
          }

          # Frontend health (not in OpenAPI schema)
          check "Frontend /" "$BASE_FE/" "200" "GET"

          # Backend routes sourced from OpenAPI-generated smoke list
          # shellcheck source=scripts/smoke-routes.sh
          source scripts/smoke-routes.sh

          if $PASS; then
            echo "✅ All smoke checks passed"
          else
            echo "::error::One or more smoke tests failed — see above"
            exit 1
          fi
