# [LEGACY — DEPRECATED 2026-06-28]
# MetoCare — Deploy to DigitalOcean VPS
# STATUS: DEPRECATED. Azure Container Apps is the sole active deploy target.
# This workflow is retained for archive/rollback reference only.
# DO NOT trigger this workflow without explicit PTH approval.
# Original header preserved below:
# MetoCare — Deploy to DigitalOcean VPS (was PRIMARY PRODUCTION)
# Trigger: OPT-IN only —
#   • push to main whose HEAD commit message contains `[deploy-do]`, OR
#   • manual workflow_dispatch.
# A normal merge to main does NOT deploy production. Tag the commit `[deploy-do]`
# (or run the workflow manually) when you intend to ship to DigitalOcean.
# Flow: build+push image → SSH to VPS → pull image → alembic upgrade head → restart backend
#
# Required GitHub Secrets:
#   DO_SSH_PRIVATE_KEY   — contents of ~/.ssh/id_ed25519_metocare_do
#   DO_VPS_IP            — 146.190.83.230
#   GHCR_PAT             — GitHub PAT with read:packages scope (for VPS docker pull)
#   MCP_DATABASE_URL     — postgresql+psycopg2://... (for alembic in CI)
#   MCP_SECRET_KEY       — production secret key
#   MCP_ENCRYPTION_KEYS  — production Fernet key

name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: short SHA)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/metocare-backend
  VPS_DEPLOY_DIR: /opt/metocare

jobs:
  build:
    # Opt-in guard: only deploy production on an explicit `[deploy-do]` push or a
    # manual dispatch. migrate + deploy `needs: build`, so skipping build cascades
    # and skips the whole pipeline for ordinary merges.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-do]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  migrate:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: pip install --quiet -r backend/requirements.txt

      - name: Run Alembic migrations
        env:
          MCP_DATABASE_URL: ${{ secrets.MCP_DATABASE_URL }}
          MCP_SECRET_KEY: ${{ secrets.MCP_SECRET_KEY }}
          MCP_ENCRYPTION_KEYS: ${{ secrets.MCP_ENCRYPTION_KEYS }}
          MCP_ENV: prod
        run: |
          DB_URL="${MCP_DATABASE_URL}"
          if [ -z "$DB_URL" ] || echo "$DB_URL" | grep -q "sqlite"; then
            echo "⏭️ No PostgreSQL URL — skipping migrations"
            exit 0
          fi
          echo "Running alembic upgrade head..."
          cd backend
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3"
            alembic upgrade head && break
            [ $attempt -lt 3 ] && sleep 10
          done
          echo "=== alembic current ==="
          alembic current

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: production

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_VPS_IP }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 300s
          script: |
            set -euo pipefail
            IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
            DEPLOY_DIR="/opt/metocare"
            cd "$DEPLOY_DIR"

            echo "=== Deploy: $IMAGE_TAG ==="
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pull new image
            docker pull "ghcr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

            # Update IMAGE_TAG in .env
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env

            # Restart backend with new image (zero-downtime: pull then restart)
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-deps --pull never backend

            # Health poll
            echo "Polling /health..."
            for i in $(seq 1 24); do
              HTTP=$(curl -sf --max-time 10 http://localhost/health 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" 2>/dev/null || echo "fail")
              echo "  [$i] /health → $HTTP"
              [ "$HTTP" = "ok" ] && echo "✅ Healthy" && exit 0
              sleep 5
            done
            echo "❌ Not healthy after 2 minutes"
            docker logs metocare-backend-1 --tail 50
            exit 1

      - name: Verify endpoints
        run: |
          VPS_IP="${{ secrets.DO_VPS_IP }}"
          echo "--- /health ---"
          curl -sf --max-time 15 "http://$VPS_IP/health"
          echo ""
          echo "--- /api/v1/info ---"
          curl -sf --max-time 15 "http://$VPS_IP/api/v1/info" | python3 -m json.tool
