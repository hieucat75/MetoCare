# =============================================================================
# MetoCare — Azure Container Apps STAGING deploy
# Auth: GitHub OIDC -> Azure federated credential (no long-lived secrets).
# Migrations: Alembic one-shot Container Apps Job (NO runtime create_all).
# Secrets: read from Key Vault via OIDC az, injected as ACA secrets.
#
# Manual only (workflow_dispatch). DigitalOcean is LEGACY/DEPRECATED — Azure ACA is the active target.
# Requires PR #4 (license-aware migration) merged to main before first run.
# =============================================================================
name: Azure Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (default: commit SHA)"
        required: false

permissions:
  id-token: write   # OIDC -> Azure
  contents: read
  packages: write   # push to GHCR

env:
  REGISTRY: ghcr.io
  RG: rg-metocare-staging
  ENV_NAME: cae-metocare-staging
  PG_NAME: psql-metocare-staging
  KV_NAME: kv-metocare-stgd9e7
  BACKEND_APP: ca-metocare-backend
  FRONTEND_APP: ca-metocare-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          echo "tag=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"
          # Short suffix for ACA revision naming (8 chars of SHA + timestamp)
          SHORT="$(echo "${{ github.event.inputs.image_tag || github.sha }}" | head -c 8)"
          TS="$(date +%s)"
          echo "suffix=${SHORT}-${TS}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Compute Container Apps FQDNs
        run: |
          # NEXT_PUBLIC_* is baked into the frontend bundle at build time, so the
          # backend FQDN must be known BEFORE the frontend image is built. The ACA
          # environment's default domain is stable, so an app's FQDN is the
          # deterministic "<app-name>.<defaultDomain>" — valid even before the app
          # exists. This lets the frontend embed the correct API base at build.
          DOMAIN=$(az containerapp env show -g "$RG" -n "$ENV_NAME" --query 'properties.defaultDomain' -o tsv)
          if [ -z "$DOMAIN" ]; then
            echo "::error::could not resolve ACA env defaultDomain for $ENV_NAME — aborting before baking a broken API URL into the frontend"
            exit 1
          fi
          BACKEND_FQDN="${BACKEND_APP}.${DOMAIN}"
          FRONTEND_FQDN="${FRONTEND_APP}.${DOMAIN}"
          echo "BACKEND_FQDN=$BACKEND_FQDN" >> "$GITHUB_ENV"
          echo "FRONTEND_FQDN=$FRONTEND_FQDN" >> "$GITHUB_ENV"
          echo "Backend:  https://$BACKEND_FQDN"
          echo "Frontend: https://$FRONTEND_FQDN"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # NEXT_PUBLIC_API_URL must be injected at build time (baked into the
          # bundle); a runtime container env var has no effect for NEXT_PUBLIC_*.
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ env.BACKEND_FQDN }}/api/v1
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/metocare-frontend:${{ steps.tag.outputs.tag }}

      - name: Resume Postgres if stopped
        run: |
          STATE=$(az postgres flexible-server show -g "$RG" -n "$PG_NAME" --query state -o tsv)
          echo "PG state: $STATE"
          if [ "$STATE" != "Ready" ]; then
            az postgres flexible-server start -g "$RG" -n "$PG_NAME"
            until [ "$(az postgres flexible-server show -g "$RG" -n "$PG_NAME" --query state -o tsv)" = "Ready" ]; do
              echo "  waiting for PG..."; sleep 10
            done
          fi

      - name: Read secrets from Key Vault
        id: kv
        run: |
          # SP has "Key Vault Secrets User" on the vault (granted during provisioning).
          DB_URL=$(az keyvault secret show --vault-name "$KV_NAME" -n mcp-database-url --query value -o tsv)
          SECRET_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n mcp-secret-key --query value -o tsv)
          ENC_KEYS=$(az keyvault secret show --vault-name "$KV_NAME" -n mcp-encryption-keys --query value -o tsv)
          APPI=$(az keyvault secret show --vault-name "$KV_NAME" -n appinsights-connection-string --query value -o tsv)
          # Azure Document Intelligence (OCR cloud fallback, v1.4.0). Endpoint is not
          # secret (a public FQDN) but kept in KV for one place to manage; key IS secret.
          DOC_INTEL_ENDPOINT=$(az keyvault secret show --vault-name "$KV_NAME" -n azure-doc-intel-endpoint --query value -o tsv)
          DOC_INTEL_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n azure-doc-intel-key --query value -o tsv)
          DEEPSEEK_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n deepseek-api-key --query value -o tsv)
          # OpenRouter — Meto AI primary gateway (Claude Sonnet 4.5). DeepSeek stays as fallback.
          OPENROUTER_KEY=$(az keyvault secret show --vault-name "$KV_NAME" -n openrouter-api-key --query value -o tsv)
          # Mask + export to later steps via env file (never echoed).
          echo "::add-mask::$DB_URL"; echo "::add-mask::$SECRET_KEY"; echo "::add-mask::$ENC_KEYS"
          echo "::add-mask::$DOC_INTEL_KEY"; echo "::add-mask::$DEEPSEEK_KEY"; echo "::add-mask::$OPENROUTER_KEY"
          {
            echo "DB_URL<<EOF"; echo "$DB_URL"; echo "EOF"
            echo "SECRET_KEY<<EOF"; echo "$SECRET_KEY"; echo "EOF"
            echo "ENC_KEYS<<EOF"; echo "$ENC_KEYS"; echo "EOF"
            echo "APPI<<EOF"; echo "$APPI"; echo "EOF"
            echo "DOC_INTEL_ENDPOINT<<EOF"; echo "$DOC_INTEL_ENDPOINT"; echo "EOF"
            echo "DOC_INTEL_KEY<<EOF"; echo "$DOC_INTEL_KEY"; echo "EOF"
            echo "DEEPSEEK_KEY<<EOF"; echo "$DEEPSEEK_KEY"; echo "EOF"
            echo "OPENROUTER_KEY<<EOF"; echo "$OPENROUTER_KEY"; echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run Alembic migration (one-shot Container Apps Job)
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}"
          JOB="caj-metocare-migrate"
          # Recreate the job each run so it always uses the current image.
          az containerapp job delete -g "$RG" -n "$JOB" --yes -o none 2>/dev/null || true
          # Image is public on GHCR — no registry credential needed (ACA pulls
          # anonymously from the image URL). Avoids the expired-GITHUB_TOKEN
          # ImagePullBackOff on scale-from-zero.
          az containerapp job create \
            --name "$JOB" --resource-group "$RG" --environment "$ENV_NAME" \
            --image "$IMG" \
            --trigger-type Manual \
            --replica-timeout 600 --replica-retry-limit 1 \
            --parallelism 1 --replica-completion-count 1 \
            --cpu 0.5 --memory 1.0Gi \
            --secrets "db-url=$DB_URL" "enc-keys=$ENC_KEYS" \
            --env-vars "MCP_DATABASE_URL=secretref:db-url" \
              "MCP_ENCRYPTION_KEYS=secretref:enc-keys" \
              "MCP_ENV=staging" \
            --command "alembic" --args "upgrade head" \
            -o none
          # Retry job start up to 3 times — ACA control plane can be briefly busy.
          for attempt in 1 2 3; do
            az containerapp job start -g "$RG" -n "$JOB" -o none && break
            echo "  job start attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          # Wait a moment for the execution record to appear before polling.
          sleep 15
          echo "Polling migration job execution..."
          for i in $(seq 1 40); do
            ST=$(az containerapp job execution list -g "$RG" -n "$JOB" \
              --query "[0].properties.status" -o tsv 2>/dev/null || echo "Running")
            # Strip whitespace
            ST="${ST//[$'\t\r\n ']}"
            echo "  $i: $ST"
            [ "$ST" = "Succeeded" ] && break
            [ "$ST" = "Failed" ] && { echo "::error::migration failed — check ACA job logs: az containerapp job execution logs -g $RG -n $JOB"; exit 1; }
            sleep 15
          done

      - name: Deploy backend Container App
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-backend:${{ steps.tag.outputs.tag }}"
          COMMON_SECRETS="db-url=$DB_URL secret-key=$SECRET_KEY enc-keys=$ENC_KEYS appi=$APPI doc-intel-key=$DOC_INTEL_KEY deepseek-api-key=$DEEPSEEK_KEY openrouter-api-key=$OPENROUTER_KEY"
          # CORS: NEXT_PUBLIC_* and the browser run from the frontend origin, so the
          # backend must allow it. Persisted as an env var here (no manual hotfix).
          # OCR (v1.0.6): MCP_FEATURE_OCR=true enables the lab-upload draft pipeline on
          # STAGING only (Tesseract runs locally in-container, cost $0).
          # OCR cloud fallback (v1.4.0): Tesseract stays PRIMARY; Azure Document
          # Intelligence (F0 free tier, docintel-metocare-staging) is the OPT-IN
          # fallback, called ONLY when local confidence is low OR zero biomarkers were
          # parsed. MCP_FEATURE_OCR_CLOUD_FALLBACK=true + MCP_OCR_CLOUD_PROVIDER=azure +
          # AZURE_DOC_INTEL_ENDPOINT/KEY enable it. No ANTHROPIC_API_KEY is provisioned.
          # Azure ACA is both staging and production path. DigitalOcean is LEGACY (deprecated 2026-06-28).
          COMMON_ENV="MCP_ENV=staging MCP_DEBUG=false \
            MCP_DATABASE_URL=secretref:db-url MCP_SECRET_KEY=secretref:secret-key \
            MCP_ENCRYPTION_KEYS=secretref:enc-keys \
            APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appi \
            MCP_CORS_ALLOWED_ORIGINS=https://${FRONTEND_FQDN},https://app.metocare.me \
            MCP_AI_MODE=production MCP_LLM_PROVIDER=deepseek MCP_OCR_MODE=mock \
            FEATURE_AI_ASSISTANT=true \
            MCP_OCR_WORKER_ENABLED=false MCP_RAG_ENABLED=false \
            MCP_STORAGE_MODE=local MCP_RATELIMIT_BACKEND=memory \
            MCP_METRICS_ENABLED=true MCP_ENABLE_DOCS=false \
            MCP_FEATURE_OCR=true MCP_FEATURE_OCR_CLOUD_FALLBACK=true \
            MCP_OCR_CLOUD_PROVIDER=azure \
            AZURE_DOC_INTEL_ENDPOINT=${DOC_INTEL_ENDPOINT} \
            AZURE_DOC_INTEL_KEY=secretref:doc-intel-key \
            MCP_DEEPSEEK_API_KEY=secretref:deepseek-api-key \
            MCP_OPENROUTER_API_KEY=secretref:openrouter-api-key \
            MCP_OPENROUTER_PRIMARY_MODEL=anthropic/claude-sonnet-4.5 \
            MCP_OPENROUTER_FALLBACK_MODEL=openai/gpt-4o-mini"
          if az containerapp show -g "$RG" -n "$BACKEND_APP" -o none 2>/dev/null; then
            az containerapp secret set -g "$RG" -n "$BACKEND_APP" --secrets $COMMON_SECRETS -o none
            az containerapp update -g "$RG" -n "$BACKEND_APP" --image "$IMG" \
              --revision-suffix "${{ steps.tag.outputs.suffix }}" \
              --min-replicas 1 --set-env-vars $COMMON_ENV -o none
          else
            az containerapp create -g "$RG" -n "$BACKEND_APP" --environment "$ENV_NAME" \
              --image "$IMG" --target-port 8000 --ingress external \
              --min-replicas 1 --max-replicas 1 --cpu 0.5 --memory 1.0Gi \
              --secrets $COMMON_SECRETS --env-vars $COMMON_ENV -o none
          fi
          FQDN=$(az containerapp show -g "$RG" -n "$BACKEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "BACKEND_FQDN=$FQDN" >> "$GITHUB_ENV"

      - name: Deploy frontend Container App
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-frontend:${{ steps.tag.outputs.tag }}"
          API_URL="https://${BACKEND_FQDN}/api/v1"
          if az containerapp show -g "$RG" -n "$FRONTEND_APP" -o none 2>/dev/null; then
            az containerapp update -g "$RG" -n "$FRONTEND_APP" --image "$IMG" \
              --revision-suffix "${{ steps.tag.outputs.suffix }}" \
              --min-replicas 1 --set-env-vars "NEXT_PUBLIC_API_URL=$API_URL" -o none
          else
            az containerapp create -g "$RG" -n "$FRONTEND_APP" --environment "$ENV_NAME" \
              --image "$IMG" --target-port 3000 --ingress external \
              --min-replicas 1 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --env-vars "NEXT_PUBLIC_API_URL=$API_URL" -o none
          fi

      - name: Health gate (liveness /health)
        run: |
          # Poll the DB-aware /api/v1/health endpoint (returns 200 only when app+DB are
          # ready; 503 when DB unreachable). The root /health is a shallow ping only.
          # Allow up to 3 minutes (18 x 10s) for the new revision to become ready.
          echo "Backend: https://${BACKEND_FQDN}/api/v1/health"
          for i in $(seq 1 18); do
            H=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${BACKEND_FQDN}/api/v1/health" || echo 000)
            echo "  $i: /api/v1/health -> $H"
            [ "$H" = "200" ] && { echo "✅ healthy"; exit 0; }
            sleep 10
          done
          echo "::error::backend unhealthy — ACA keeps previous healthy revision (auto-rollback)"
          exit 1

      - name: CORS guard — ensure app.metocare.me is always allowed
        run: |
          CURRENT=$(az containerapp show -g "$RG" -n "$BACKEND_APP" \
            --query "properties.template.containers[0].env[?name=='MCP_CORS_ALLOWED_ORIGINS'].value" \
            -o tsv)
          if echo "$CURRENT" | grep -q "app.metocare.me"; then
            echo "✅ CORS already contains app.metocare.me: $CURRENT"
          else
            echo "⚠️ app.metocare.me missing from CORS ($CURRENT) — patching..."
            az containerapp update -g "$RG" -n "$BACKEND_APP" \
              --set-env-vars "MCP_CORS_ALLOWED_ORIGINS=${CURRENT},https://app.metocare.me" \
              -o none
            echo "✅ CORS patched"
          fi
