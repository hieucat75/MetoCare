# MetoCare — Azure App Service Deployment (Docker/GHCR path)
# Build Docker image → push GHCR → configure App Service to pull container.

name: Build and deploy Python app to Azure Web App - MetoCare

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: MetoCare
  AZURE_RESOURCE_GROUP: rg-metocare-dev
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/metocare-backend
  APP_URL: https://metocare-a8hdh0grbcerbmfm.malaysiawest-01.azurewebsites.net

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image info
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_85913B813978481E9F2F8C1BBB437F62 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_82802F503FBB4981BB11E7836D0FDE28 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42799659C6C44C1D8151F9153AD06872 }}

      - name: Configure App Service for container
        run: |
          # Derive the short SHA image tag (same logic as docker/metadata-action sha prefix)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          echo "Deploying image: $IMAGE"

          # Switch App Service to container mode
          az webapp config container set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://${{ env.REGISTRY }}" \
            --container-registry-user "${{ github.actor }}" \
            --container-registry-password "${{ secrets.GITHUB_TOKEN }}" \
            --output none

          # App settings — keep SQLite for dev, no Oryx needed
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              MCP_ENV=dev \
              MCP_DEBUG=false \
              MCP_AI_MODE=mock \
              MCP_OCR_MODE=mock \
              MCP_STORAGE_MODE=local \
              MCP_DATABASE_URL="sqlite:////app/data/mcp_dev.sqlite3" \
              WEBSITES_PORT=8000 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              WEBSITES_CONTAINER_START_TIME_LIMIT=300 \
            --output none

          # Clear any old startup-file — container CMD handles startup
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file '' \
            --output none

          echo "✅ Container config applied."

      - name: Restart and wait for startup
        run: |
          az webapp restart \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

          echo "Polling /health for up to 5 minutes..."
          APP_URL="${{ env.APP_URL }}"
          for i in $(seq 1 30); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 "$APP_URL/health" 2>/dev/null || echo "000")
            echo "  Attempt $i/30: /health → HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "  ✅ App is UP!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ❌ App not healthy after 5 minutes"
              exit 1
            fi
            sleep 10
          done

      - name: Verify endpoints
        run: |
          APP_URL="${{ env.APP_URL }}"
          echo "--- GET / ---"
          curl -s --max-time 15 "$APP_URL/" | python3 -m json.tool 2>/dev/null || echo "(non-JSON)"

          echo "--- GET /health ---"
          curl -s --max-time 15 "$APP_URL/health" | python3 -m json.tool 2>/dev/null || echo "(non-JSON)"

          echo "--- GET /api/v1/info ---"
          curl -s --max-time 15 "$APP_URL/api/v1/info" | python3 -m json.tool 2>/dev/null || echo "(non-JSON)"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Downloading App Service logs ==="
          az webapp log download \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --log-file /tmp/app_logs.zip 2>&1 || echo "Could not download logs"

          if [ -f /tmp/app_logs.zip ]; then
            mkdir -p /tmp/app_logs_dir
            unzip -q /tmp/app_logs.zip -d /tmp/app_logs_dir 2>/dev/null || true
            chmod -R a+r /tmp/app_logs_dir 2>/dev/null || true
            echo "=== StartupLogs ==="
            find /tmp/app_logs_dir/LogFiles/StartupLogs -name '*.log' 2>/dev/null | sort | while read f; do
              echo "--- FILE: $f ---"
              cat "$f"
            done
            echo "=== docker.log (most recent) ==="
            find /tmp/app_logs_dir/LogFiles -name '*docker.log' 2>/dev/null | sort | tail -1 | xargs tail -200 2>/dev/null || true
          fi
