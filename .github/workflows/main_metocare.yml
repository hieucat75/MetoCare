# MetoCare — Azure App Service Deployment
# Backend only (FastAPI/Python).

name: Build and deploy Python app to Azure Web App - MetoCare

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: MetoCare
  AZURE_RESOURCE_GROUP: rg-metocare-dev
  PYTHON_VERSION: '3.11'
  APP_URL: https://metocare-a8hdh0grbcerbmfm.malaysiawest-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployment zip
        working-directory: .
        run: |
          cd backend
          zip -r ../deploy.zip . \
            --exclude "antenv/*" \
            --exclude "tests/*" \
            --exclude "requirements-dev.txt" \
            --exclude "data/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc"

      - name: Upload deployment zip
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_85913B813978481E9F2F8C1BBB437F62 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_82802F503FBB4981BB11E7836D0FDE28 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42799659C6C44C1D8151F9153AD06872 }}

      - name: Configure app settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              MCP_ENV=dev \
              MCP_DEBUG=false \
              MCP_AI_MODE=mock \
              MCP_OCR_MODE=mock \
              MCP_STORAGE_MODE=local \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            --output none
          
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file 'gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120' \
            --output none
          
          echo "Config applied."

      - name: Ensure app is running before deploy
        run: |
          # Start the app (idempotent)
          az webapp start \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
          
          # Poll Kudu SCM endpoint (not app endpoint) until it responds
          SCM_URL="https://${{ env.AZURE_WEBAPP_NAME }}.scm.malaysiawest-01.azurewebsites.net"
          echo "Polling SCM endpoint for readiness..."
          for i in $(seq 1 20); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -u "" "$SCM_URL/api/settings" 2>/dev/null || echo "000")
            echo "  Attempt $i: SCM HTTP $HTTP"
            # 401 = Kudu up but auth required (expected with OIDC — that's fine)
            # 200 = authenticated (publish profile)
            # 403 = still stopped
            if [ "$HTTP" = "401" ] || [ "$HTTP" = "200" ]; then
              echo "  ✅ Kudu is responding — proceeding with deploy"
              break
            fi
            sleep 10
          done

      - name: Deploy zip via Kudu REST API
        run: |
          # Get bearer token for Kudu via OIDC login
          TOKEN=$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)
          
          # Use management plane zip deploy API (not Kudu direct — avoids SCM auth issue)
          az webapp deploy \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path deploy.zip \
            --type zip \
            --async true
          
          echo "Deployment initiated (async). Waiting 90s for Oryx build + restart..."
          sleep 90

      - name: Verify deployment
        run: |
          APP_URL="${{ env.APP_URL }}"
          echo "=== GET / ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/")
          echo "  HTTP $STATUS"

          echo "=== GET /health ==="
          HEALTH=$(curl -sf "$APP_URL/health" 2>/dev/null) && echo "  ✅ $HEALTH" || echo "  ❌ FAILED"

          echo "=== GET /api/v1/info ==="
          INFO=$(curl -sf "$APP_URL/api/v1/info" 2>/dev/null) && echo "  ✅ $INFO" || echo "  ❌ FAILED"
