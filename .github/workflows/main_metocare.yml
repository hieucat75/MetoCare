# MetoCare — Azure App Service Deployment (Docker/GHCR path)
# Build Docker image → push GHCR → run Alembic migrations → configure App Service.

name: Build and deploy Python app to Azure Web App - MetoCare

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: MetoCare
  AZURE_RESOURCE_GROUP: rg-metocare-dev
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/metocare-backend
  APP_URL: https://metocare-a8hdh0grbcerbmfm.malaysiawest-01.azurewebsites.net

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image info
        run: |
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  run-migrations:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only run migrations when MCP_DATABASE_URL secret is set (postgres prod mode)
    # Skip if running against SQLite (legacy dev path).
    # IMPORTANT: PostgreSQL server must exist before this job can succeed.
    # Run provision-postgres.yml ONCE first to create the server.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --quiet -r requirements.txt

      - name: Check database URL type
        id: dbcheck
        run: |
          DB_URL="${{ secrets.MCP_DATABASE_URL }}"
          if [ -z "$DB_URL" ]; then
            echo "MCP_DATABASE_URL secret not set — skipping migrations (SQLite dev mode)"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif echo "$DB_URL" | grep -q "sqlite"; then
            echo "SQLite detected — skipping Alembic migrations (SQLite uses create_all)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "PostgreSQL detected — running Alembic migrations"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Alembic migrations
        if: steps.dbcheck.outputs.skip == 'false'
        env:
          MCP_DATABASE_URL: ${{ secrets.MCP_DATABASE_URL }}
          MCP_SECRET_KEY: ${{ secrets.MCP_SECRET_KEY }}
          MCP_ENCRYPTION_KEYS: ${{ secrets.MCP_ENCRYPTION_KEYS }}
          MCP_ENV: prod
        run: |
          cd backend
          echo "Running: alembic upgrade head"
          # Retry up to 3 times with 10s delay (handles transient PG startup)
          for attempt in 1 2 3; do
            if alembic upgrade head; then
              echo "✅ Alembic migrations complete (attempt $attempt)"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "❌ Alembic migrations failed after 3 attempts"
              echo "IMPORTANT: If the PostgreSQL server does not exist yet, run provision-postgres.yml first."
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo ""
          echo "Migration history:"
          alembic history --verbose 2>/dev/null | tail -30 || true

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, run-migrations]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_85913B813978481E9F2F8C1BBB437F62 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_82802F503FBB4981BB11E7836D0FDE28 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42799659C6C44C1D8151F9153AD06872 }}

      - name: Configure App Service for container
        run: |
          # Derive the short SHA image tag (same logic as docker/metadata-action sha prefix)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          echo "Deploying image: $IMAGE"

          # Switch App Service to container mode.
          # Use GHCR_PAT (long-lived OAuth token) — GITHUB_TOKEN is job-scoped
          # and expires after the workflow; Azure cannot pull with it later.
          az webapp config container set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://${{ env.REGISTRY }}" \
            --container-registry-user "${{ github.actor }}" \
            --container-registry-password "${{ secrets.GHCR_PAT }}" \
            --output none

          # Determine if using PostgreSQL (prod) or SQLite (dev fallback)
          DB_URL="${{ secrets.MCP_DATABASE_URL }}"
          if [ -z "$DB_URL" ] || echo "$DB_URL" | grep -q "sqlite"; then
            # Dev/legacy mode: SQLite with persistent storage
            echo "Configuring App Service for SQLite (dev mode)"
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings \
                MCP_ENV=dev \
                MCP_DEBUG=false \
                MCP_AI_MODE=mock \
                MCP_OCR_MODE=mock \
                MCP_STORAGE_MODE=local \
                MCP_DATABASE_URL="sqlite:////app/data/mcp_dev.sqlite3" \
                WEBSITES_PORT=8000 \
                WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
                WEBSITES_CONTAINER_START_TIME_LIMIT=300 \
              --output none
          else
            # Production mode: PostgreSQL + Alembic managed schema
            echo "Configuring App Service for PostgreSQL (prod mode)"
            az webapp config appsettings set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings \
                MCP_ENV=prod \
                MCP_DEBUG=false \
                MCP_AI_MODE=mock \
                MCP_OCR_MODE=mock \
                MCP_STORAGE_MODE=local \
                MCP_DATABASE_URL="${{ secrets.MCP_DATABASE_URL }}" \
                MCP_SECRET_KEY="${{ secrets.MCP_SECRET_KEY }}" \
                MCP_ENCRYPTION_KEYS="${{ secrets.MCP_ENCRYPTION_KEYS }}" \
                WEBSITES_PORT=8000 \
                WEBSITES_CONTAINER_START_TIME_LIMIT=300 \
              --output none
            # Remove persistent storage setting (not needed with PostgreSQL)
            az webapp config appsettings delete \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --setting-names WEBSITES_ENABLE_APP_SERVICE_STORAGE \
              --output none 2>/dev/null || true
            echo "✅ PostgreSQL production config applied"
          fi

          # Clear any old startup-file — container CMD handles startup
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file '' \
            --output none

          echo "✅ Container config applied."

      - name: Restart and wait for startup
        run: |
          az webapp restart \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

          echo "Polling /health for up to 5 minutes..."
          APP_URL="${{ env.APP_URL }}"
          for i in $(seq 1 30); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 "$APP_URL/health" 2>/dev/null || echo "000")
            echo "  Attempt $i/30: /health → HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "  ✅ App is UP!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ❌ App not healthy after 5 minutes"
              exit 1
            fi
            sleep 10
          done

      - name: Verify endpoints
        run: |
          APP_URL="${{ env.APP_URL }}"
          echo "--- GET / ---"
          curl -s --max-time 15 "$APP_URL/" | python3 -m json.tool 2>/dev/null || echo "(non-JSON)"

          echo "--- GET /health ---"
          curl -s --max-time 15 "$APP_URL/health" | python3 -m json.tool 2>/dev/null || echo "(non-JSON)"

          echo "--- GET /api/v1/info ---"
          curl -s --max-time 15 "$APP_URL/api/v1/info" | python3 -m json.tool 2>/dev/null || echo "(non-JSON)"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Downloading App Service logs ==="
          az webapp log download \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --log-file /tmp/app_logs.zip 2>&1 || echo "Could not download logs"

          if [ -f /tmp/app_logs.zip ]; then
            mkdir -p /tmp/app_logs_dir
            unzip -q /tmp/app_logs.zip -d /tmp/app_logs_dir 2>/dev/null || true
            chmod -R a+r /tmp/app_logs_dir 2>/dev/null || true
            echo "=== StartupLogs ==="
            find /tmp/app_logs_dir/LogFiles/StartupLogs -name '*.log' 2>/dev/null | sort | while read f; do
              echo "--- FILE: $f ---"
              cat "$f"
            done
            echo "=== docker.log (most recent) ==="
            find /tmp/app_logs_dir/LogFiles -name '*docker.log' 2>/dev/null | sort | tail -1 | xargs tail -200 2>/dev/null || true
          fi
