# =============================================================================
# MetoCare — FRONTEND-ONLY Azure Container Apps STAGING deploy
#
# Deploys ONLY the patient/web frontend (ca-metocare-frontend). It does NOT:
#   - build or deploy the backend
#   - run Alembic / the migration Container Apps Job
#   - create, delete, or modify any other Azure resource (DB, registry, secrets, RG)
#
# The backend revision is left exactly as-is; the workflow verifies it is
# unchanged after deploy. ACA keeps the previous frontend revision, so rollback
# is `az containerapp update -n ca-metocare-frontend --image <previous-tag>`
# (or shift 100% traffic back to the previous revision).
#
# Manual only (workflow_dispatch). DigitalOcean production is NOT touched.
# The full backend+frontend pipeline remains in azure-staging.yml (untouched).
# =============================================================================
name: Frontend-only Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Frontend image tag (default: commit SHA)"
        required: false

permissions:
  id-token: write # OIDC -> Azure
  contents: read
  packages: write # push frontend image to GHCR

env:
  REGISTRY: ghcr.io
  RG: rg-metocare-staging
  ENV_NAME: cae-metocare-staging
  BACKEND_APP: ca-metocare-backend
  FRONTEND_APP: ca-metocare-frontend

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: azure-staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "tag=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Record current state (rollback baseline) + compute FQDNs
        run: |
          # Backend FQDN is needed at BUILD time: NEXT_PUBLIC_* is baked into the
          # bundle. We only READ backend config here — never modify it.
          DOMAIN=$(az containerapp env show -g "$RG" -n "$ENV_NAME" --query 'properties.defaultDomain' -o tsv)
          [ -z "$DOMAIN" ] && { echo "::error::cannot resolve ACA env domain"; exit 1; }
          echo "BACKEND_FQDN=${BACKEND_APP}.${DOMAIN}" >> "$GITHUB_ENV"
          echo "FRONTEND_FQDN=${FRONTEND_APP}.${DOMAIN}" >> "$GITHUB_ENV"

          BE_REV=$(az containerapp show -g "$RG" -n "$BACKEND_APP" --query properties.latestReadyRevisionName -o tsv)
          FE_REV=$(az containerapp show -g "$RG" -n "$FRONTEND_APP" --query properties.latestReadyRevisionName -o tsv)
          FE_IMG=$(az containerapp show -g "$RG" -n "$FRONTEND_APP" --query 'properties.template.containers[0].image' -o tsv)
          echo "BACKEND_REV_BEFORE=$BE_REV" >> "$GITHUB_ENV"
          echo "FRONTEND_REV_BEFORE=$FE_REV" >> "$GITHUB_ENV"
          echo "::notice::Baseline — backend revision: $BE_REV | frontend revision: $FE_REV | frontend image: $FE_IMG"

      - name: Validate API URL before build
        run: |
          API_URL="https://${BACKEND_FQDN}/api/v1"

          if [ -z "$API_URL" ] || [ "$API_URL" = "https:///api/v1" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is empty — backend FQDN resolution failed"; exit 1
          fi

          if echo "$API_URL" | grep -qi "api\.metocare\.com"; then
            echo "::error::NEXT_PUBLIC_API_URL contains dead placeholder domain 'api.metocare.com' (got: $API_URL)"; exit 1
          fi

          if echo "$API_URL" | grep -qi "localhost"; then
            echo "::error::NEXT_PUBLIC_API_URL points to localhost — staging must use the live ACA backend (got: $API_URL)"; exit 1
          fi

          if ! echo "$API_URL" | grep -q "/api/v1$"; then
            echo "::error::NEXT_PUBLIC_API_URL must end with /api/v1 (got: $API_URL)"; exit 1
          fi

          # Poll backend /health with retries to handle ACA cold-start on scale-from-zero.
          # minReplicas=1 prevents scale-to-zero, but a new revision provisioning during
          # a concurrent deploy can still cause a brief startup window. Retry for up to
          # 90 seconds (6 × 15s) before declaring the backend dead.
          echo "Checking backend health (https://${BACKEND_FQDN}/health) with retry..."
          HEALTH="000"
          for i in $(seq 1 6); do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${BACKEND_FQDN}/health" || echo "000")
            echo "  attempt $i: HTTP $HEALTH"
            [ "$HEALTH" = "200" ] && break
            [ "$i" -lt 6 ] && sleep 15
          done
          if [ "$HEALTH" != "200" ]; then
            echo "::error::Backend health check returned $HEALTH after 6 attempts — backend may be down"; exit 1
          fi

          echo "::notice::Pre-build validation PASSED — API_URL=$API_URL backend /health=$HEALTH"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push FRONTEND image (frontend only)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ env.BACKEND_FQDN }}/api/v1
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/metocare-frontend:${{ steps.tag.outputs.tag }}

      - name: Post-build bundle URL audit
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-frontend:${{ steps.tag.outputs.tag }}"
          TMPDIR=$(mktemp -d)

          # Extract Next.js static chunks from the runner image
          docker pull "$IMG" --quiet
          CID=$(docker create "$IMG")
          docker cp "$CID:/app/.next/static/chunks" "$TMPDIR/chunks"
          docker rm "$CID"

          FAIL=0

          # Must NOT contain dead placeholder domain
          HITS=$(grep -rl "api\.metocare\.com" "$TMPDIR/chunks" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::BUNDLE AUDIT FAILED: 'api.metocare.com' found in built chunks:"
            echo "$HITS"
            FAIL=1
          fi

          # Must NOT contain localhost:8000
          HITS=$(grep -rl "localhost:8000" "$TMPDIR/chunks" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::BUNDLE AUDIT FAILED: 'localhost:8000' found in built chunks:"
            echo "$HITS"
            FAIL=1
          fi

          # Must contain the correct ACA backend FQDN
          HITS=$(grep -rl "$BACKEND_FQDN" "$TMPDIR/chunks" 2>/dev/null || true)
          if [ -z "$HITS" ]; then
            echo "::error::BUNDLE AUDIT FAILED: '$BACKEND_FQDN' NOT found in built chunks — URL not baked in correctly"
            FAIL=1
          fi

          rm -rf "$TMPDIR"

          if [ "$FAIL" = "0" ]; then
            echo "::notice::Post-build bundle audit PASSED — correct backend FQDN confirmed in JS bundle"
          else
            exit 1
          fi

      - name: Update FRONTEND Container App only
        run: |
          IMG="${REGISTRY}/${{ github.repository_owner }}/metocare-frontend:${{ steps.tag.outputs.tag }}"
          API_URL="https://${BACKEND_FQDN}/api/v1"
          # --revision-suffix forces ACA to create a new revision even when the image tag
          # is already active (single-revision mode deduplicates by image+config hash).
          SUFFIX="fe-$(echo '${{ steps.tag.outputs.tag }}' | cut -c1-8)"
          az containerapp update -g "$RG" -n "$FRONTEND_APP" --image "$IMG" \
            --revision-suffix "$SUFFIX" \
            --min-replicas 1 \
            --set-env-vars "NEXT_PUBLIC_API_URL=$API_URL" -o none
          echo "Deployed frontend image: $IMG (revision suffix: $SUFFIX)"

      - name: Verify — new frontend revision, backend unchanged
        run: |
          # ACA provisions new revisions asynchronously — poll until latestReadyRevisionName
          # changes (up to 3 min). The update step returns before the revision is "ready".
          echo "Waiting for new frontend revision to become ready..."
          FE_REV_AFTER=""
          for i in $(seq 1 18); do
            FE_REV_AFTER=$(az containerapp show -g "$RG" -n "$FRONTEND_APP" --query properties.latestReadyRevisionName -o tsv)
            [ "$FE_REV_AFTER" != "$FRONTEND_REV_BEFORE" ] && break
            echo "  $i: still $FE_REV_AFTER — waiting 10s"
            sleep 10
          done
          BE_REV_AFTER=$(az containerapp show -g "$RG" -n "$BACKEND_APP" --query properties.latestReadyRevisionName -o tsv)
          echo "Frontend revision: $FRONTEND_REV_BEFORE -> $FE_REV_AFTER"
          echo "Backend revision:  $BACKEND_REV_BEFORE -> $BE_REV_AFTER"
          if [ "$FE_REV_AFTER" = "$FRONTEND_REV_BEFORE" ]; then
            echo "::error::frontend revision did not change after 3 min — deploy did not take effect"; exit 1
          fi
          if [ "$BE_REV_AFTER" != "$BACKEND_REV_BEFORE" ]; then
            echo "::error::backend revision changed ($BACKEND_REV_BEFORE -> $BE_REV_AFTER) — frontend-only invariant violated"; exit 1
          fi
          echo "::notice::OK — new frontend revision $FE_REV_AFTER; backend unchanged ($BE_REV_AFTER)"

      - name: Smoke — /login 200 + dashboard reachable
        run: |
          ok=0
          for i in $(seq 1 30); do
            L=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://${FRONTEND_FQDN}/login" || echo 000)
            D=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://${FRONTEND_FQDN}/dashboard" || echo 000)
            echo "  $i: /login -> $L  /dashboard -> $D"
            if [ "$L" = "200" ] && [ "$D" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ] && echo "✅ frontend healthy" || { echo "::error::frontend smoke failed (P0) — rollback: az containerapp update -n $FRONTEND_APP -g $RG --image <previous tag>"; exit 1; }
