version: "3.9"

# MetoCare — DigitalOcean VPS production stack
# Services: backend (FastAPI/Gunicorn), postgres, redis, nginx
# All secrets injected via .env file (never committed to git)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metocare
      POSTGRES_USER: mcpadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpadmin -d metocare"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/hieucat75/metocare-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MCP_ENV: prod
      MCP_DEBUG: "false"
      MCP_DATABASE_URL: postgresql+psycopg2://mcpadmin:${POSTGRES_PASSWORD}@postgres:5432/metocare
      MCP_SECRET_KEY: ${MCP_SECRET_KEY}
      MCP_ENCRYPTION_KEYS: ${MCP_ENCRYPTION_KEYS}
      MCP_AI_MODE: mock
      MCP_OCR_MODE: mock
      MCP_STORAGE_MODE: local
      MCP_RATELIMIT_BACKEND: redis
      MCP_RATELIMIT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MCP_CORS_ALLOWED_ORIGINS: "https://${DOMAIN}"
    volumes:
      - backend_storage:/app/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - internal
      - external

volumes:
  postgres_data:
  redis_data:
  backend_storage:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
