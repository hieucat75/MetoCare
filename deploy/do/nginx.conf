# MetoCare Nginx — HTTP only until certbot provisions TLS cert
# After first certbot run, replace with HTTPS config below

server {
    listen 80;
    server_name _;

    # ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS once cert exists
    # Uncomment after certbot:
    # return 301 https://$host$request_uri;

    # Temporary: proxy directly until TLS is ready
    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
    }
}

